# This is an example goreleaser.yaml file with some sane defaults.
# Make sure to check the documentation at http://goreleaser.com
version: 2
before:
  hooks:
    - make buildDeps
    # You may remove this if you don't use go modules.
    - go mod download
    # you may remove this if you don't need go generate
    - go generate ./...
    - make completions
builds:
  - binary: minikube-support
    id: minikube-support
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    ldflags:
      - -X 'github.com/qaware/minikube-support/version.Version={{.Version}}'
      - -X 'github.com/qaware/minikube-support/version.Revision={{.ShortCommit}}'
      - -X 'github.com/qaware/minikube-support/version.Branch={{.Branch}}'
      - -X 'github.com/qaware/minikube-support/version.CommitDate={{.CommitTimestamp}}'
      - -s -w -extldflags '-static'
    goarch:
      - amd64
      - arm
      - arm64
    goarm:
      - 6
    flags:
      - -trimpath
    mod_timestamp: '{{ .CommitTimestamp }}'
  - binary: minikube-support
    id: minikube-support-macos
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    ldflags:
      - -X 'github.com/qaware/minikube-support/version.Version={{.Version}}'
      - -X 'github.com/qaware/minikube-support/version.Revision={{.ShortCommit}}'
      - -X 'github.com/qaware/minikube-support/version.Branch={{.Branch}}'
      - -X 'github.com/qaware/minikube-support/version.CommitDate={{.CommitTimestamp}}'
      - -s -w -extldflags '-static'
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    mod_timestamp: '{{ .CommitTimestamp }}'
#    hooks:
#      post: gon gon.hcl
homebrew_casks:
  - repository:
      owner: qaware
      name: homebrew-minikube-support
      # GITHUB_TOKEN is scoped to this repository and cannot push to the tap.
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: goreleaser@qaware.de
    homepage: "https://github.com/qaware/minikube-support"
    description: "The minikube support tools provides a better integration into your local operating system. "
    license: "MIT"
    dependencies:
      - formula: mkcert
      - formula: minikube
      - formula: helm
    completions:
      bash: completions/minikube-support.bash
      zsh: completions/minikube-support.zsh
      fish: completions/minikube-support.fish
    # The binaries are not notarized, so Gatekeeper would refuse to start them.
    # hooks.post.install_steps needs GoReleaser v2.19; the quoted token keeps
    # Homebrew's {{staged_path}} away from GoReleaser's own templating.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/minikube-support"], must_succeed: false
        end
      end

archives:
  - files:
      - README.md
      - LICENSE
      - completions/*
      - docs/**
checksum:
  name_template: 'checksums.txt'
  algorithm: sha512
snapshot:
  version_template: "{{ incpatch .Version }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
